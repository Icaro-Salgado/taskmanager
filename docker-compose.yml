name: taskmanager

x-backend: &backend
  # One image name for every backend service, so it is built once and shared.
  image: taskmanager-backend
  build: ./backend
  env_file: .env
  environment: &backend-env
    # Inside the compose network the services are reached by name, whatever .env says for the host.
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies the migrations, then exits. The services below wait for it.
  migrate:
    <<: *backend
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  # One-shot: loads the demo data, the SQL files in backend/seed/ in name order (each is safe to
  # run twice), then exits. SEED_DEMO=0 (`./run.sh up --no-seed`) skips it. No application code.
  seed:
    image: postgres:17-alpine
    environment:
      SEED_DEMO: ${SEED_DEMO:-1}
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend/seed:/seed:ro
    command: >-
      sh -c 'if [ "$$SEED_DEMO" = 0 ]; then echo "Demo data skipped"; exit 0; fi;
      for f in /seed/*.sql; do psql -q -v ON_ERROR_STOP=1 -f "$$f" || exit 1; echo "Loaded $$f"; done'
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    environment:
      <<: *backend-env
      # nginx (the frontend service) is in front and sets X-Forwarded-For to the client address.
      DRF_NUM_PROXIES: "1"
    # No published port: every request goes through nginx. A port open on the host would let a
    # client send its own X-Forwarded-For and escape the login rate limit.
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs the Celery tasks: assignment notifications and the overdue job.
  worker:
    <<: *backend
    command: celery -A config worker --loglevel INFO --concurrency 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Queues the daily overdue job. Exactly one beat may run, or the job would be queued twice.
  # Its schedule state goes to /tmp, outside the code directory.
  beat:
    <<: *backend
    command: celery -A config beat --loglevel INFO --schedule /tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The React app built and served by nginx, which also proxies /api/, /admin/ and /static/ to api.
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
