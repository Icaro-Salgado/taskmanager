server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API (Swagger included), the Django admin site and its static files live in the api service.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://api:8000;
        # $http_host keeps the port, so Django's CSRF origin check matches for the admin site.
        proxy_set_header Host $http_host;
        # The client address, replacing any value the client sent. The api counts the login rate
        # limit per address from this header (DRF_NUM_PROXIES=1 in docker-compose.yml).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built assets have content hashes in their names: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other path is a page of the single-page app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
